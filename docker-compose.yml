# The development stack: `docker compose up` runs the bot against the example
# spec in dry-run, and the same stack backs the Postgres test tier and the
# storage/retention work driven by the Makefile (`make help`).
#
# Storage note: Azurite emulates the **Blob** API only — it does not implement
# ADLS Gen2 hierarchical namespace. All archive access therefore stays on the
# flat Blob surface, so local and cloud behave identically.

services:
  db:
    # Built rather than pulled: the stock image has no pg_cron. Debian-based
    # (postgres:17, not -alpine) because postgresql-17-cron ships for Debian.
    build:
      context: ./deploy/local
      dockerfile: postgres.Dockerfile
    image: news-tg-bot-db:local
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=newsbot
    environment:
      POSTGRES_USER: newsbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newsbot}
      POSTGRES_DB: newsbot
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/local/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # 5433 on the host to avoid clashing with a local pg; this matches the
      # tests' default DSN (tests/conftest.py), so a plain `pytest` works.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsbot -d newsbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  azurite:
    # Blob emulator for the object-storage archive. Queue and table are not
    # started, so an accidental dependency on them fails here, not in cloud.
    image: mcr.microsoft.com/azure-storage/azurite
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --location
      - /data
    volumes:
      - azuritedata:/data
    ports:
      - "10000:10000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    # IMAGE overrides the local build with a published image reference;
    # the default builds from this checkout — no registry account needed.
    image: ${IMAGE:-news-tg-bot:local}
    command: alembic upgrade head
    env_file: .env
    environment:
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    image: ${IMAGE:-news-tg-bot:local}
    command: python -m cli run
    env_file: .env
    environment:
      TZ: UTC
    volumes:
      # SPEC_FILE defaults to the tracked example so `docker compose up`
      # works before any private config exists. Point it at your own file
      # (e.g. SPEC_FILE=./spec.json after `cp spec.example.json spec.json`).
      - ${SPEC_FILE:-./spec.example.json}:/app/spec.json:ro
      - ./schemas:/app/schemas:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  webhook:
    build: .
    image: ${IMAGE:-news-tg-bot:local}
    command: python -m cli serve
    env_file: .env
    environment:
      TZ: UTC
    ports: ["8000:8000"]
    volumes:
      - ${SPEC_FILE:-./spec.example.json}:/app/spec.json:ro
      - ./schemas:/app/schemas:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["dev"]

  adminer:
    image: adminer
    ports: ["8080:8080"]
    profiles: ["dev"]

volumes:
  pgdata:
  azuritedata:
