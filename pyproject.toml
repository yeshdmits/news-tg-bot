[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "news-tg-bot"
# The version is not tracked in any file: it is derived from the v* git tags
# (setuptools-scm), which CI creates on merge to main from the Conventional
# Commit history — see docs/releasing.md and ADR 0009.
dynamic = ["version"]
description = "Spec-driven RSS news bot with a PostgreSQL archive"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.2",
    "pydantic>=2.7",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "structlog>=24",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "httpx2>=2"]
translate = ["deepl>=1.18"]
export = ["pyarrow>=16"]
# The object-storage archive: export to Parquet, read it back for training.
# adlfs (fsspec) rather than duckdb's own azure extension, which installs
# itself from the network at query time — CONTRIBUTING.md requires that no
# test touches the network. DuckDB still runs the queries, over an Arrow
# dataset that pyarrow+adlfs supplies. See docs/archive-format.md.
archive = [
    "azure-storage-blob>=12.20",
    "pyarrow>=16",
    "duckdb>=1.0",
    "adlfs>=2024.2",
    "zstandard>=0.22",
]

[tool.setuptools]
packages = ["feedspec", "fetcher", "archive", "newsbot"]
py-modules = ["cli", "specsource"]

[tool.setuptools_scm]
# Used when building without git metadata (e.g. from a source archive). The
# Docker build passes the real version via
# SETUPTOOLS_SCM_PRETEND_VERSION_FOR_NEWS_TG_BOT instead.
fallback_version = "0.0.0"

[tool.commitizen]
# Version analysis for the release pipeline (.github/scripts/compute-release.sh).
# The current version is read from the v* git tags, never from a file.
# major_version_zero is deliberately NOT set here: the release script passes
# --major-version-zero on the CLI only while the latest tag is v0.*, so
# breaking changes bump minor pre-1.0 and major afterwards.
name = "cz_conventional_commits"
version_provider = "scm"
tag_format = "v$version"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "pg: requires a running PostgreSQL (docker compose up db / CI service container)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
