name: Build, Test & Push Docker Image

# Fork-friendly by design:
#   - test + neutrality guard run on every push and PR with zero secrets;
#   - build-and-push publishes to ghcr.io/<this repo> with the built-in
#     GITHUB_TOKEN unless vars.IMAGE_NAME points elsewhere (then registry
#     credentials come from secrets);
#   - deploy runs only when the deploy repository variables are set, so a
#     fresh fork skips it with a message instead of failing.
# Never use pull_request_target here — it would run untrusted PR code with
# repository secrets in scope.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Repository variable IMAGE_NAME overrides (e.g. docker.io/<user>/<repo>);
  # the default publishes to this repository's GHCR namespace. Make the
  # GHCR package public after the first push so Container Apps can pull
  # anonymously, or add a registry block in the Terraform module.
  IMAGE_NAME: ${{ vars.IMAGE_NAME || format('ghcr.io/{0}', github.repository) }}

jobs:
  check-neutral:
    # Keeps operator-specific values from re-entering the tracked tree.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Neutrality guard
        run: ./scripts/check-neutral.sh

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: newsbot
          POSTGRES_PASSWORD: newsbot
          POSTGRES_DB: newsbot_test
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsbot -d newsbot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://newsbot:newsbot@localhost:5432/newsbot_test
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install .[dev,translate]

      - name: Smoke check (compile all modules)
        run: python -m compileall feedspec fetcher archive newsbot cli.py specsource.py

      - name: Validate the example configuration
        run: python -m cli validate --spec spec.example.json

      - name: Run tests
        run: pytest

  build-and-push:
    runs-on: ubuntu-latest
    needs: [check-neutral, test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
          && startsWith(env.IMAGE_NAME, 'ghcr.io/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
          && !startsWith(env.IMAGE_NAME, 'ghcr.io/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Deploys only from main — the same gate as the image push, since the
    # sha-tagged image only exists in the registry for main commits — and
    # only when the deploy target is configured via repository variables,
    # so forks skip this instead of failing. Topology lives in
    # deploy/terraform (applied manually); this job only swaps images.
    # Ordering below is load-bearing: the migrate job must reach Succeeded
    # before either consumer sees the new image, because the new code may
    # depend on the new schema — do not parallelise the steps.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.AZURE_RESOURCE_GROUP != '' && vars.NAME_PREFIX != ''
    # Two rapid merges must not race each other through migrate/rollout.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AZ_RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      PREFIX: ${{ vars.NAME_PREFIX }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run migration job
        run: |
          IMAGE=${{ env.IMAGE_NAME }}:${GITHUB_SHA::7}
          az containerapp job update -n "$PREFIX-migrate" -g "$AZ_RG" --image "$IMAGE"
          az containerapp job start  -n "$PREFIX-migrate" -g "$AZ_RG"

      - name: Wait for migration to succeed
        run: |
          for i in $(seq 1 60); do
            STATUS=$(az containerapp job execution list -n "$PREFIX-migrate" -g "$AZ_RG" \
                     --query "[0].properties.status" -o tsv)
            echo "$PREFIX-migrate: ${STATUS:-unknown}"
            case "$STATUS" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) exit 1 ;;
            esac
            sleep 10
          done
          echo "migration timed out after 10 minutes"; exit 1

      - name: Update fetch job and webhook app
        run: |
          IMAGE=${{ env.IMAGE_NAME }}:${GITHUB_SHA::7}
          az containerapp job update -n "$PREFIX-fetch" -g "$AZ_RG" --image "$IMAGE"
          az containerapp update     -n "$PREFIX-bot"   -g "$AZ_RG" --image "$IMAGE"

  deploy-skipped:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && (vars.AZURE_RESOURCE_GROUP == '' || vars.NAME_PREFIX == '')
    steps:
      - name: Explain how to enable deploys
        run: |
          echo "Deploy skipped: no target configured (this is expected on a fresh fork)."
          echo "Build, tests and image publish completed."
          echo
          echo "To enable Azure deploys, set repository variables:"
          echo "  NAME_PREFIX           - your Terraform name_prefix (e.g. myproject)"
          echo "  AZURE_RESOURCE_GROUP  - usually <name_prefix>-rg"
          echo "and repository secrets for OIDC:"
          echo "  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID"
          echo "See docs/deployment/azure.md."
