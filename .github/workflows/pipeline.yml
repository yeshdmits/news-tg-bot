name: Pipeline

# Merge-driven releases, fork-friendly by design:
#   - test + neutrality guard run on every push and PR with zero secrets;
#     PRs also build the image without publishing it;
#   - after a push to main, the release job reads the Conventional Commits
#     since the last v* tag (feat -> minor, fix -> patch, breaking -> major
#     but minor while 0.x, docs/chore/ci/etc -> nothing, "Release-As: X.Y.Z"
#     footer overrides) and, when a release is due, creates the v* tag and
#     the GitHub Release in this same run;
#   - the image goes to ghcr.io/<this repo> with the built-in GITHUB_TOKEN
#     unless vars.IMAGE_NAME points elsewhere (then registry credentials
#     come from secrets); every main push publishes the commit-sha tag, a
#     release additionally publishes X.Y.Z, X.Y, X and latest;
#   - deploy runs only for releases, and only when the deploy repository
#     variables are set, so a fresh fork skips it with a message instead of
#     failing.
#
# Everything runs as sequential jobs of THIS workflow — release, then build,
# then deploy — because tags and releases created with the built-in
# GITHUB_TOKEN do not trigger other workflows. A separate workflow on
# `push: tags` or `release: published` would never fire. Do not split it.
# See docs/adr/0009-tag-on-merge-releases.md before changing the shape.
#
# Never use pull_request_target here — it would run untrusted PR code with
# repository secrets in scope.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two quick merges must not interleave: the second run would compute its
# version before the first has tagged. Main-branch runs queue instead
# (cancel-in-progress only for superseded PR pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Repository variable IMAGE_NAME overrides (e.g. docker.io/<user>/<repo>);
  # the default publishes to this repository's GHCR namespace. Make the
  # GHCR package public after the first push so Container Apps can pull
  # anonymously, or add a registry block in the Terraform module.
  IMAGE_NAME: ${{ vars.IMAGE_NAME || format('ghcr.io/{0}', github.repository) }}

jobs:
  check-neutral:
    # Keeps operator-specific values from re-entering the tracked tree.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Neutrality guard
        run: ./scripts/check-neutral.sh

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: newsbot
          POSTGRES_PASSWORD: newsbot
          POSTGRES_DB: newsbot_test
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsbot -d newsbot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://newsbot:newsbot@localhost:5432/newsbot_test
      TZ: UTC
      # The real version comes from git tags (setuptools-scm); the shallow
      # CI checkout has none, and tests don't care about the version.
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_NEWS_TG_BOT: "0.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install .[dev,translate]

      - name: Smoke check (compile all modules)
        run: python -m compileall feedspec fetcher archive newsbot cli.py specsource.py

      - name: Validate the example configuration
        run: python -m cli validate --spec spec.example.json

      - name: Run tests
        run: pytest

  release:
    # Decides from the commits since the last v* tag whether this merge
    # releases, and creates the tag + GitHub Release when it does. No file
    # in the repository records the version (see ADR 0009), so nothing is
    # committed back to main — which is also what keeps this loop-free.
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [check-neutral, test]
    permissions:
      contents: write
    outputs:
      released: ${{ steps.decide.outputs.released }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - name: Checkout (full history — the version is derived from tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install commitizen
        run: pip install 'commitizen==4.*'

      - name: Compute next version
        id: decide
        run: ./.github/scripts/compute-release.sh

      - name: Create tag and GitHub Release
        if: steps.decide.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
        # One API call creates the tag and the Release together, so a "tag
        # without release" half-state cannot occur. Release notes are
        # generated from the merged PRs; there is no tracked changelog.
        run: >-
          gh release create "v$VERSION"
          --target "$GITHUB_SHA"
          --title "v$VERSION"
          --generate-notes

  build-and-push:
    runs-on: ubuntu-latest
    needs: [check-neutral, test, release]
    # `release` is skipped on pull requests; still build there (without
    # pushing) to prove the Dockerfile.
    if: >-
      !cancelled()
      && needs.check-neutral.result == 'success'
      && needs.test.result == 'success'
      && (needs.release.result == 'success'
          || (github.event_name == 'pull_request' && needs.release.result == 'skipped'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: >-
          github.event_name == 'push'
          && startsWith(env.IMAGE_NAME, 'ghcr.io/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: >-
          github.event_name == 'push'
          && !startsWith(env.IMAGE_NAME, 'ghcr.io/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        # The immutable sha tag is published on every main push. The
        # version tags and latest move only on a release — a non-release
        # push must not move latest.
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version || '0.0.0' }},enable=${{ needs.release.outputs.released == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version || '0.0.0' }},enable=${{ needs.release.outputs.released == 'true' }}
            type=semver,pattern={{major}},value=v${{ needs.release.outputs.version || '0.0.0' }},enable=${{ needs.release.outputs.released == 'true' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.released == 'true' }}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          build-args: |
            APP_VERSION=${{ needs.release.outputs.released == 'true' && needs.release.outputs.version || format('0.0.0+{0}', github.sha) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [release, build-and-push]
    # Deploys only for releases — the version-tagged image only exists in
    # the registry for releases — and only when the deploy target is
    # configured via repository variables, so forks skip this instead of
    # failing. Topology lives in deploy/terraform (applied manually); this
    # job only swaps images.
    # Ordering below is load-bearing: the migrate job must reach Succeeded
    # before either consumer sees the new image, because the new code may
    # depend on the new schema — do not parallelise the steps.
    if: >-
      !cancelled()
      && needs.build-and-push.result == 'success'
      && needs.release.outputs.released == 'true'
      && vars.AZURE_RESOURCE_GROUP != '' && vars.NAME_PREFIX != ''
    # Two rapid merges must not race each other through migrate/rollout.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AZ_RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      PREFIX: ${{ vars.NAME_PREFIX }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run migration job
        run: |
          IMAGE=${{ env.IMAGE_NAME }}:$VERSION
          az containerapp job update -n "$PREFIX-migrate" -g "$AZ_RG" --image "$IMAGE"
          az containerapp job start  -n "$PREFIX-migrate" -g "$AZ_RG"

      - name: Wait for migration to succeed
        run: |
          for i in $(seq 1 60); do
            STATUS=$(az containerapp job execution list -n "$PREFIX-migrate" -g "$AZ_RG" \
                     --query "[0].properties.status" -o tsv)
            echo "$PREFIX-migrate: ${STATUS:-unknown}"
            case "$STATUS" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) exit 1 ;;
            esac
            sleep 10
          done
          echo "migration timed out after 10 minutes"; exit 1

      - name: Update fetch job and webhook app
        run: |
          IMAGE=${{ env.IMAGE_NAME }}:$VERSION
          az containerapp job update -n "$PREFIX-fetch" -g "$AZ_RG" --image "$IMAGE"
          az containerapp update     -n "$PREFIX-bot"   -g "$AZ_RG" --image "$IMAGE"

  deploy-skipped:
    runs-on: ubuntu-latest
    needs: [release, build-and-push]
    if: >-
      !cancelled()
      && needs.build-and-push.result == 'success'
      && needs.release.outputs.released == 'true'
      && (vars.AZURE_RESOURCE_GROUP == '' || vars.NAME_PREFIX == '')
    steps:
      - name: Explain how to enable deploys
        run: |
          echo "Deploy skipped: no target configured (this is expected on a fresh fork)."
          echo "Build, tests, image publish and the GitHub Release completed."
          echo
          echo "To enable Azure deploys, set repository variables:"
          echo "  NAME_PREFIX           - your Terraform name_prefix (e.g. myproject)"
          echo "  AZURE_RESOURCE_GROUP  - usually <name_prefix>-rg"
          echo "and repository secrets for OIDC:"
          echo "  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID"
          echo "See docs/deployment/azure.md."
